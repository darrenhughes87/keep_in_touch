# Keep In Touch — production compose stack
#
# Replace IMAGE below with whichever image you build/pull.
#
# - If you use the included GitHub Actions workflow, your image is at:
#     ghcr.io/<your-github-username>/<repo-name>:latest
# - If you build locally on the host (e.g. directly on a Raspberry Pi):
#     keep_in_touch:local

services:
  kit-web:
    image: ${IMAGE:-keep_in_touch:local}
    container_name: kit-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3100
      HOSTNAME: 0.0.0.0
      DATA_DIR: /data
      TZ: ${TZ:-UTC}
    volumes:
      - kit_data:/data
    ports:
      - "3100:3100"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  kit-cron:
    image: alpine:3.20
    container_name: kit-cron
    restart: unless-stopped
    depends_on:
      kit-web:
        condition: service_started
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl tzdata >/dev/null 2>&1 || true
        # Alpine's cron daemon reads system time from /etc/localtime, not the
        # TZ env var, so symlink it from the requested zone. Without this the
        # 08:30 push fires at 08:30 UTC, which is 09:30 BST — an hour late
        # for UK users during summer time.
        if [ -n "$$TZ" ] && [ -f "/usr/share/zoneinfo/$$TZ" ]; then
          cp /usr/share/zoneinfo/$$TZ /etc/localtime
          echo $$TZ > /etc/timezone
        fi
        cat > /etc/crontabs/root <<EOF
        30 6 * * * curl -sS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://kit-web:3100/api/cron/compute-suggestions >> /var/log/cron.log 2>&1
        30 8 * * * curl -sS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://kit-web:3100/api/cron/morning-push >> /var/log/cron.log 2>&1
        EOF
        # Log current container time on boot so deploys can verify TZ took.
        echo "[kit-cron] booted, container time: $$(date)"
        crond -f -l 2

volumes:
  kit_data:
