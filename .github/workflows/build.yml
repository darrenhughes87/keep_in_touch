name: Build + push container image

# Builds an arm64 container image (Raspberry Pi 4/5, Apple Silicon, etc.)
# on GitHub's native ARM runner — no QEMU emulation, ~60-90s cached builds.
# Pushes to ghcr.io/<owner>/<repo>:latest
#
# If you also need amd64 (most VPSes, x86 servers), change `runs-on` to
# `ubuntu-latest` and re-add `linux/amd64,linux/arm64` under platforms.
# Native amd64 + emulated arm64 takes ~5 min; matrix-strategy native builds
# of each take ~2 min total.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercased)
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
